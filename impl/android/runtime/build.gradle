plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ai.dsh.runtime'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        // HarmonyOS 3 low-end devices sit on an Android 10 base.
        minSdk 28
        externalNativeBuild {
            cmake {
                // c++_shared, not c++_static: libnode.so is a shared library that
                // was built against libc++_shared, and two copies of the C++
                // runtime in one process means two std::string layouts.
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17'
            }
        }
        ndk {
            // Only arm64 is populated with a libnode.so; shipping an empty
            // x86_64 slice would produce an APK that installs and then dies on
            // System.loadLibrary.
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
