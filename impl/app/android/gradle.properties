org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# aapt2 override. AGP 7.4.2 bundles an aapt2 that cannot parse the API 35
# resource table and dies at :app:processDebugResources with "entry offsets
# overlap actual entry data". Pointing at the SDK build-tools 35 binary keeps
# AGP 7.4 (the newest version Flutter 3.0's gradle plugin tolerates, it calls
# the removed `applicationVariants` API) while compiling against compileSdk 35.
# Drop this line when the project moves to AGP 8.x + a newer Flutter.
#
# Set it to your own SDK path before building the Flutter shell. The value below
# is just a default for the container image this project is built in — replace
# it with <ANDROID_HOME>/build-tools/35.0.0/aapt2 on your machine.
android.aapt2FromMavenOverride=/root/android-tools/sdk/build-tools/35.0.0/aapt2
